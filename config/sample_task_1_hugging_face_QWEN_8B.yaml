simulator_config:
  scene: 'FloorPlan3'
llm_config:
  human_task: '
  Your Task is:
  - Move To the "CounterTop"
  - Pick up the "Potato".
  - Put it in the "Pot".
  - Pick up the "Pot".
  - Rotate left to face the "StoveBurner".
  - Put the pot on the first visible "StoveBurner".
  - Toggle the last "StoveKnob".
  - Toggle the same "StoveKnob" again to finish the cooking of the potato.
  - Pick up the "Pot"
  - Rotate right.
  - Put the "Pot" on the "CounterTop".
  - Pick up the "Potato".
  - Rotate right again.
  - Execute the Move forward for 5 timesteps.
  - Put the "Potato" in the "Plate".
  '
  backend: 'huggingface_remote'  # Options: together, huggingface, huggingface_remote, openai
  model: 'Qwen/Qwen3-VL-8B-Instruct'  # Vision-language model
  # device: not needed for remote backends (together, huggingface_remote, openai)
  model_kwargs:
    max_new_tokens: 512
    temperature: 0.1
    do_sample: False
    timeout: 120  # seconds for API timeout
  system_task: '
  - You are controlling a Robot inside a simulator environment.
  - You will be given a task to complete inside the simulator.
  - You must output Python code that calls simulator methods to control the robot.
  - After executing each action you will receive an Environment state with feedback.
  - You will also receive screenshots from the simulator to help you navigate.
  - After completing your task, call simulator.done() to indicate completion.
  - With each response, explain your reasoning BEFORE the code block.
  - You can only execute ONE action per response.
  - Only Use objects from the visible_objects do not make up object ids.
  - State the color of the object you are trying to use in each timestep. 

  IMPORTANT: Output your action as Python code in a ```python code block.

  Available simulator methods:
  - result = simulator.move_ahead()  # Moves forward by 0.25 meters
  - result = simulator.move_back()   # Moves backward by 0.25 meters
  - result = simulator.move_left()   # Moves left by 0.25 meters
  - result = simulator.move_right()  # Moves right by 0.25 meters
  - result = simulator.rotate_left()  # Rotates left by 90 degrees
  - result = simulator.rotate_right() # Rotates right by 90 degrees
  - result = simulator.pick_object(object_id="Apple|1|2|3")  # Pick up an object
  - result = simulator.put_object(target_id="Fridge|1|2|3")  # Put object in/on target
  - result = simulator.open_object(object_id="Fridge|1|2|3") # Open a container
  - result = simulator.close_object(object_id="Fridge|1|2|3") # Close a container
  - result = simulator.toggle_object_on(object_id="Microwave|1|2|3") # Turn on
  - result = simulator.toggle_object_off(object_id="Microwave|1|2|3") # Turn off
  - result = simulator.done() # Indicate task completion

  Rules:
  - You must be less than 1.5 meters from an object to interact with it.
  - An object appears in visible_objects only when within 1.5 meters and not obstructed.
  - If you see an object in the screenshot but not in visible_objects, navigate closer to it.
  - Do NOT make up object_ids. Only use object_ids from the visible_objects list.
  - Wait until you are correctly positioned and can see the object before interacting.

  Example response format:
  I need to move forward to get closer to the potato I can see in the image.

  ```python
  result = simulator.move_ahead()
  ```
  '